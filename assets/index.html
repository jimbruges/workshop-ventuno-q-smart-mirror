<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Smart Mirror</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The live camera feed served by main.py, used as the mirror image. -->
    <img id="mirror" src="/stream" alt="Camera feed" />

    <div id="panel">
      <h1>🪞 AI Smart Mirror</h1>

      <label>Detected right now</label>
      <ul id="detected"></ul>

      <label for="trigger">Trigger class</label>
      <select id="trigger"></select>
      <!-- Fills up while the trigger class is held in front of the camera. -->
      <div id="hold"><div id="holdBar"></div></div>

      <label for="prompt">Mirror prompt</label>
      <textarea id="prompt" rows="4"></textarea>

      <h2 id="status"></h2>
      <div id="spinner"></div>
      <p id="answer"></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
